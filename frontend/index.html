    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="BHUIYAN INDUSTRY — internal accounts and production management system."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>BHUIYAN INDUSTRY — Accounts &amp; Production</title>
    <script type="text/javascript">
      // Undoes the redirect 404.html made for a deep link or a hard refresh
      // on GitHub Pages (e.g. /bhuiyan/sales) — restores the real path via
      // the History API *before* React mounts, so the router sees "/sales"
      // rather than "/" and the visitor lands on the page they asked for
      // instead of always the dashboard.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
