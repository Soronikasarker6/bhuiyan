<!doctype html>
<html lang="en" data-ui5-compact-size>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!--
      Written for the public homepage — the one page here search engines
      should index. Every fact below is from the company profile the site
      already publishes (/api/public/company-profile) and the landing page's
      own product list; nothing is invented. The internal app's routes set
      their own title and a noindex tag at runtime (see SeoForRoute in
      src/router/AppRouter.tsx), and robots.txt keeps crawlers out of them.
    -->
    <meta
      name="description"
      content="Bhuiyan Industry is an agro-based limestone manufacturing company in Demra, Dhaka, supplying Vietnam White, Oman Red and Grey limestone. Call +880 1716-808811 or email admin@bhuiyanindustry.com."
    />
    <link rel="canonical" href="https://bhuiyanindustry.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bhuiyan Industry" />
    <meta property="og:title" content="Bhuiyan Industry — Limestone Manufacturer in Demra, Dhaka" />
    <meta
      property="og:description"
      content="Agro-based limestone manufacturing company supplying Vietnam White, Oman Red and Grey limestone from Demra, Dhaka."
    />
    <meta property="og:url" content="https://bhuiyanindustry.com/" />
    <meta property="og:image" content="https://bhuiyanindustry.com/icon-192.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Bhuiyan Industry",
        "description": "Agro-Based Limestone Manufacturing Company",
        "url": "https://bhuiyanindustry.com/",
        "logo": "https://bhuiyanindustry.com/icon-192.png",
        "email": "admin@bhuiyanindustry.com",
        "telephone": "+880 1716-808811",
        "founder": { "@type": "Person", "name": "Aminul Islam Bhuiyan", "jobTitle": "Founder & CEO" },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Shukurshi Bhuiyan Bari, Sarulia",
          "addressLocality": "Demra, Dhaka",
          "postalCode": "1361",
          "addressCountry": "BD"
        },
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Vietnam White Limestone" } },
          { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Oman Red Limestone" } },
          { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Grey Limestone" } }
        ]
      }
    </script>
    <!--
      The house mark — the same stacked stones the sidebar draws (`StoneStack`
      in src/layouts/Sidebar.tsx), so the browser tab is identifiable at a
      glance among a row of them.

      Written inline as a data URI rather than shipped as public/favicon.svg on
      purpose: `build:single` folds the whole app into one double-clickable
      file, and a favicon referenced by path would be a loose asset alongside
      it — missing the moment that file is emailed or copied on its own. A data
      URI travels inside the document and costs no request anywhere.

      Simplified from the drawn mark: the stones are more opaque and slightly
      larger here, because the subtle opacity fade that reads well at 36px in
      the rail turns to mud at the 16px a tab actually renders.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232e3725'/%3E%3Cg fill='%23f4eee2'%3E%3Cellipse cx='12' cy='18.9' rx='8' ry='2.5'/%3E%3Cellipse cx='10.4' cy='13.8' rx='5.9' ry='2.3' opacity='.88'/%3E%3Cellipse cx='13.4' cy='8.8' rx='4.1' ry='2' opacity='.76'/%3E%3Cellipse cx='11.2' cy='4.6' rx='2.3' ry='1.4' opacity='.64'/%3E%3C/g%3E%3C/svg%3E"
    />
    <!--
      Real files for the icon too: Google Search (and some crawlers) ignore a
      data-URI favicon and want a fetchable one, at least 48×48. The
      single-file build strips every `data-hosted-icon` link (scripts/inline.mjs).
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" data-hosted-icon />
    <link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" data-hosted-icon />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" data-hosted-icon />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" data-hosted-icon />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Bhuiyan Industry — Limestone Manufacturer in Demra, Dhaka</title>
    <script type="text/javascript">
      // Undoes the redirect 404.html made for a deep link or a hard refresh
      // on GitHub Pages (e.g. /bhuiyan/sales) — restores the real path via
      // the History API *before* React mounts, so the router sees "/sales"
      // rather than "/" and the visitor lands on the page they asked for
      // instead of always the dashboard.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- For visitors and crawlers without JavaScript: the essentials, from the same confirmed profile. -->

          Address: Shukurshi Bhuiyan Bari, Sarulia, Demra, Dhaka-1361<br />
          Founder &amp; CEO: Aminul Islam Bhuiyan
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
