name: Deploy to GitHub Pages

# GitHub Pages is set to deploy from "GitHub Actions" (Settings → Pages), which
# means nothing is ever published until a workflow like this one exists and
# runs — there is no default build/deploy behaviour to fall back on.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a push that lands mid-deploy should win over
# whatever is still in flight, not queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # GH_PAGES=true switches vite.config.ts to an absolute '/bhuiyan/'
        # base — this is a *project* Pages site, not a user/org site at the
        # domain root, so every asset URL and the router's basename both need
        # that prefix. See vite.config.ts and src/main.tsx.
        run: npm run build
        env:
          GH_PAGES: 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
