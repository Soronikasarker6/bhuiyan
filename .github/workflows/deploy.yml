name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Install frontend dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4. Build frontend
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://bhuiyanindustry.com/api
        run: npm run build

      # 5. Verify build output
      - name: Verify build
        run: |
          echo "Checking frontend/dist..."
          test -d frontend/dist
          echo "Build directory exists."
          find frontend/dist -maxdepth 2 -type f | head -50

      # 6. Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/bhuiyan_github_actions
          chmod 600 ~/.ssh/bhuiyan_github_actions

          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      # 7. Test SSH connection
      - name: Test Hostinger SSH connection
        run: |
          ssh \
            -i ~/.ssh/bhuiyan_github_actions \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "echo 'SSH connection successful'"

      # 8. Deploy frontend/dist
      - name: Deploy to Hostinger
        run: |
          rsync -avz \
            --delete \
            -e "ssh -i ~/.ssh/bhuiyan_github_actions -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=yes" \
            frontend/dist/ \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:/home/${{ secrets.HOSTINGER_USERNAME }}/domains/bhuiyanindustry.com/public_html/"

      # 9. Verify deployment
      - name: Verify deployment
        run: |
          ssh \
            -i ~/.ssh/bhuiyan_github_actions \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "cd /home/${{ secrets.HOSTINGER_USERNAME }}/domains/bhuiyanindustry.com/public_html && echo 'Deployment completed' && ls -la"